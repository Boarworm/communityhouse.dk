uuid: builder_blocks_timeline
handle: Builder\Blocks\Timeline
type: mixin
name: Timeline
fields:
    items:
        type: repeater
        span: full
        tab: Content
        prompt: Add item
        titleFrom: title
        translatable: true
        form:
            fields:
                month:
                    label: Month
                    type: dropdown
                    span: auto
                    options:
                        '': ...
                        January: January
                        February: February
                        March: March
                        April: April
                        May: May
                        June: June
                        July: July
                        August: August
                        September: September
                        October: October
                        November: November
                        December: December
                year:
                    label: Year
                    type: text
                    span: auto
                title:
                    label: Title
                    type: text
                    span: full
                    translatable: true
                text:
                    label: Description
                    type: richeditor
                    span: full
                    size: small
                    translatable: true
    block_name:
        label: Name
        tab: Block properties
        commentAbove: "Block name for organization purposes"
        type: text
        span: auto
        default: Timeline
    advanced_content:
        type: mixin
        source: Builder\Mixins\BlockAdvanced
